name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Both rag-engine steps can go once rag-engine is on Maven Central.
      - uses: actions/checkout@v7
        with:
          repository: agentworkshq/spring-ai-rag-engine
          ref: main
          path: spring-ai-rag-engine
      - name: Install rag-engine into the local Maven repository
        working-directory: spring-ai-rag-engine
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp install -DskipTests
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Build and test
        run: ./mvnw -B -ntp verify
